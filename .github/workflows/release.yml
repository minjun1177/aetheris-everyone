name: Build apps

# Builds the double-click apps for Windows, macOS and Linux.
# A tag like v1.0.0 also publishes them on the GitHub Releases page.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: AetherisEveryone-Windows.exe
          - os: macos-latest
            artifact: AetherisEveryone-macOS-AppleSilicon.dmg
          - os: macos-15-intel
            artifact: AetherisEveryone-macOS-Intel.dmg
          - os: ubuntu-22.04
            artifact: AetherisEveryone-Linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pillow
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Build
        run: pyinstaller packaging/aetheris_everyone.spec --noconfirm --clean

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python packaging/smoke_test.py dist/AetherisEveryone.exe
          mv dist/AetherisEveryone.exe "${{ matrix.artifact }}"
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          python packaging/smoke_test.py "dist/Aetheris Everyone.app/Contents/MacOS/AetherisEveryone"
          mkdir dmg
          cp -R "dist/Aetheris Everyone.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Aetheris Everyone" -srcfolder dmg -ov -format UDZO "${{ matrix.artifact }}"
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          python packaging/smoke_test.py dist/AetherisEveryone
          mkdir -p pkg/AetherisEveryone
          cp dist/AetherisEveryone pkg/AetherisEveryone/
          tar czf "${{ matrix.artifact }}" -C pkg AetherisEveryone

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          gh release create "${GITHUB_REF_NAME}" out/* \
            --title "Aetheris Everyone ${GITHUB_REF_NAME}" \
            --notes-file packaging/RELEASE_NOTES.md \
            || gh release upload "${GITHUB_REF_NAME}" out/* --clobber
